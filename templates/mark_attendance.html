<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mark Attendance | Smart Attendance System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.25);
        }

        .icon {
            text-align: center;
            font-size: 45px;
            margin-bottom: 12px;
        }

        h1 {
            text-align: center;
            color: #172554;
            font-size: 25px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #334155;
            font-weight: bold;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        button {
            width: 100%;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .message {
            margin-bottom: 18px;
            padding: 12px;
            border-radius: 8px;
            background: #eff6ff;
            color: #1d4ed8;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="icon">📱</div>

        <h1>Mark Your Attendance</h1>

        <p class="subtitle">
            {% if session %}
                Session: {{ session["session_name"] }}
            {% else %}
                Session ID: {{ session_id }}
            {% endif %}
            <br>
            Verify your student credentials to continue.
        </p>

        {% if message %}
            <div class="message">
                {{ message }}
            </div>
        {% endif %}

        <form
            action="{{ url_for('submit_attendance', session_id=session_id) }}"
            method="POST"
        >

            <label for="roll_number">Roll Number</label>

            <input
                type="text"
                id="roll_number"
                name="roll_number"
                placeholder="Enter your roll number"
                required
                autocomplete="username"
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
                autocomplete="current-password"
            >

            <button type="submit">
                Verify & Mark Attendance
            </button>

        </form>

        <a href="{{ url_for('home') }}" class="back-link">
            ← Back to Home
        </a>

    </div>

</body>
</html>
