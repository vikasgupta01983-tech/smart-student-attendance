<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Successful</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0fdf4;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .success-card {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 40px 25px;
            border-radius: 22px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        .check-circle {
            width: 95px;
            height: 95px;
            background: #dcfce7;
            color: #16a34a;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 55px;
            margin: 0 auto 25px;
        }

        h1 {
            color: #166534;
            font-size: 27px;
            margin-bottom: 14px;
        }

        p {
            color: #64748b;
            font-size: 16px;
            line-height: 1.6;
        }

        .status {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #15803d;
            padding: 13px;
            border-radius: 12px;
            margin-top: 25px;
            font-size: 15px;
            font-weight: bold;
        }

        .footer {
            margin-top: 25px;
            font-size: 13px;
            color: #94a3b8;
        }
    </style>
</head>

<body>

    <div class="success-card">

        <div class="check-circle">
            ✓
        </div>

        <h1>Attendance Marked!</h1>

        <p>
            Your attendance has been successfully recorded.
            You can now safely close this page.
        </p>

        <div class="status">
            ✓ Attendance Successfully Submitted
        </div>

        <div class="footer">
            Smart Student Attendance System
        </div>

    </div>

</body>
</html>
