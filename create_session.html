<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Attendance Session</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header>
        <h1>Create Attendance Session</h1>
        <p>Smart Student Attendance System</p>
    </header>

    <main class="container">
        <section class="welcome-card">

            <h2>New Session</h2>

            {% if message %}
                <p>{{ message }}</p>
            {% endif %}

            <form method="POST">
                <label for="session_name">Session Name</label>
                <br><br>

                <input
                    type="text"
                    id="session_name"
                    name="session_name"
                    placeholder="Example: CSE Core - Python Lecture"
                    required
                >

                <br><br>

                <button type="submit">Create Session</button>
            </form>

            {% if qr_image %}
                <hr>

                <h2>Your Attendance QR Code</h2>

                <p>Students can scan this QR code to open the attendance page.</p>

                <img
                    src="{{ url_for('static', filename=qr_image) }}"
                    alt="Attendance QR Code"
                    width="250"
                >

                <p><strong>Session ID:</strong> {{ session_id }}</p>
            {% endif %}

            <br>
            <a href="/teacher">Back to Teacher Dashboard</a>

        </section>
    </main>

</body>
</html>
